<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowDump</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: one column — dictation pad on top, sorted task board below */
:root{--bg:#f3f5f2;--fg:#17201b;--muted:#5d6b62;--card:#ffffff;--line:#d5ddd7;--accent:#1f8a5b;--hot:#c2410c;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111714;--fg:#e6eee9;--muted:#93a39a;--card:#1a221e;--line:#2c3832;--accent:#4cc38a;--hot:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111714;--fg:#e6eee9;--muted:#93a39a;--card:#1a221e;--line:#2c3832;--accent:#4cc38a;--hot:#fb923c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
main{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:32px 48px;display:grid;gap:20px}
h1{font:800 2.4rem/1 var(--display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p.lede{margin:0;color:var(--muted);max-width:60ch}
kbd{font:.85em var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--card)}
textarea{width:100%;box-sizing:border-box;min-height:9rem;font:1.05rem/1.5 var(--body);color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:500 .95rem var(--body);border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.stat{font:.85rem var(--mono);color:var(--muted)}
section h2{font:600 1.1rem var(--display);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
section h2 small{font:.8rem var(--mono);color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
li input{margin-top:5px;accent-color:var(--accent)}
li.done .t{text-decoration:line-through;color:var(--muted)}
.t{flex:1;min-width:0}
.tag{font:.75rem var(--mono);padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.hot{border-color:var(--hot);color:var(--hot)}
.empty{color:var(--muted);font-style:italic}
</style></head><body>
<main>
  <h1>Flow<span>Dump</span></h1>
  <p class="lede">Hold your Wispr Flow hotkey and ramble everything on your mind. FlowDump splits it into tasks and sorts them into Today, This week and Later, flagging anything urgent.</p>
  <label for="dump" class="stat">Brain dump — click here, then hold <kbd>Fn</kbd> / <kbd>Ctrl+Win</kbd> and speak</label>
  <textarea id="dump"></textarea>
  <div class="row">
    <button id="sort">Sort my dump</button>
    <button id="clear" class="ghost">Clear</button>
    <span class="stat" id="stat"></span>
  </div>
  <div id="board"></div>
</main>
<script>
const SAMPLE="I need to submit the hacker house task tonight, it's urgent. Also call mom tomorrow morning. Finish the robotics assignment by Friday. Buy groceries. Maybe start learning Rust someday. Email Pratham about the GitHub invite asap. Gym this week.";
const days="monday|tuesday|wednesday|thursday|friday|saturday|sunday";
function bucket(s){
  const l=s.toLowerCase();
  if(/\b(today|tonight|now|asap|this (morning|evening|afternoon))\b/.test(l))return"Today";
  if(/\b(tomorrow|this week|weekend|by (\w+day)|on (\w+day))\b/.test(l)||new RegExp(`\\b(${days})\\b`).test(l))return"This week";
  return"Later";
}
const urgent=s=>/\b(urgent|asap|important|deadline|must)\b/i.test(s);
function split(text){
  return text.split(/(?<=[.!?])\s+|\n+|\s*(?:,\s*)?\b(?:and then|also|plus)\b\s*/i)
    .map(s=>s.replace(/^(i need to|i have to|i should|i must|need to|gotta|and|maybe)\s+/i,"").replace(/[.,!?]+$/,"").trim())
    .filter(s=>s.length>2).map(s=>s[0].toUpperCase()+s.slice(1));
}
function render(){
  const tasks=split(dump.value),groups={"Today":[],"This week":[],"Later":[]};
  tasks.forEach(t=>groups[bucket(t)].push(t));
  board.innerHTML=Object.entries(groups).map(([g,ts])=>`<section><h2>${g} <small>${ts.length}</small></h2>${ts.length?`<ul>${ts.map(t=>`<li><input type="checkbox" aria-label="Done"><span class="t">${t.replace(/</g,"&lt;")}</span>${urgent(t)?'<span class="tag hot">urgent</span>':""}</li>`).join("")}</ul>`:'<p class="empty">Nothing here.</p>'}</section>`).join("");
  const words=dump.value.trim().split(/\s+/).filter(Boolean).length;
  stat.textContent=`${words} words → ${tasks.length} tasks`;
}
board.addEventListener("change",e=>e.target.closest("li")?.classList.toggle("done",e.target.checked));
sort.onclick=render;
clear.onclick=()=>{dump.value="";render();dump.focus()};
let tm;dump.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(render,400)});
dump.value=SAMPLE;render();
</script></body>

</html>
